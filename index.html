		<script>
			window.onload = function() { document.body.classList.remove('is-preload'); }

		<script>
			var labels = ["wizardry", "sigil", "code", "realistic", "universe", "notes", "black hat", "./w174rd"];

			// Size #typed-text to the label about to type, so the closing brace
			// hugs it and the braced group only re-centres between labels — never
			// walks while one types. A hidden twin measures at the live font size.
			var valbox = document.querySelector(".valbox"),
			    ruler = document.createElement("span"),
			    curLabel = "";
			ruler.setAttribute("aria-hidden", "true");
			ruler.style.cssText = "position:absolute;left:-9999px;top:0;visibility:hidden;white-space:pre";
			document.querySelector(".typed").appendChild(ruler);
			// reserve room for the quotes, the label and the caret between the
			// label and the closing quote, so the box holds the brace still while
			// the inner text + trailing quote hug the caret as it types.
			function sizeSlot(txt) { curLabel = txt; ruler.textContent = '"' + txt + ' "'; valbox.style.width = ruler.offsetWidth + "px"; }
			sizeSlot(labels[0]);
			window.addEventListener("resize", function () { if (curLabel) sizeSlot(curLabel); });

			var typed = new Typed("#typed-text", {
				strings: labels,
				typeSpeed: 70,
				backSpeed: 50,
				loop: true,
				preStringTyped: function (pos) { sizeSlot(labels[pos]); }
			});
		</script>
